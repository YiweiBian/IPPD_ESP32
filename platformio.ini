[env:motor_esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM3
lib_deps =
  teemuatlut/TMCStepper@^0.7.3
;   waspinator/AccelStepper@^1.64

; if you want to program ESP32_A, uncomment the following code
; src_filter = +<ESP32_A> -<ESP32_B>

; if you want to program ESP32_B, uncomment the following code
src_filter = +<ESP32-B> -<ESP32-B>
